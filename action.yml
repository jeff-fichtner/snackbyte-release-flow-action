name: "Snackbyte Release Flow"
description: >-
  Turn an environments.json manifest into a release flow: resolve-env ("is this pushed branch a
  deployable environment?") and derive-version ("what version tag does this push get?"). Creates a
  tag only — never a commit or branch push.
author: "Snackbyte"

branding:
  icon: "tag"
  color: "purple"

inputs:
  branch:
    description: "The pushed branch to resolve against the manifest."
    required: false
    default: ${{ github.ref_name }}
  manifest:
    description: "Path to the environments manifest (relative to the checkout)."
    required: false
    default: "./environments.json"
  package-json:
    description: >-
      Path to the package.json whose version is read (relative to the checkout, like manifest).
      Set it when the releasable lives in a subdirectory — a uses: step runs at the checkout
      root, so the caller's working-directory does not reach it. Under build-id it supplies
      MAJOR.MINOR (unless major-minor is set); under package-json it supplies the whole version.
    required: false
    default: "./package.json"
  major-minor:
    description: >-
      Override for the MAJOR.MINOR version line (build-id strategy only). When empty, the Action
      reads the package-json file's version and uses its first two components. Ignored when
      version-strategy is package-json.
    required: false
    default: ""
  version-strategy:
    description: >-
      How the version number is chosen. 'build-id' (default) = global monotonic, tree-reused PATCH,
      for deployable apps. 'package-json' = tag the package.json version verbatim, for published
      libraries (intentional SemVer).
    required: false
    default: "build-id"
  tag-prefix:
    description: >-
      Optional tag-namespace prefix, e.g. 'client-node-'. Use it when a repository holds more than
      one releasable: the tag becomes <prefix>v<version><suffix>, and the derivation reads only
      tags carrying this exact prefix (un-prefixed tags and other prefixes are invisible to it).
      Empty (default) keeps the bare 'v' tags. Allowed: [A-Za-z0-9._-], starting alphanumeric and
      ending in '-'; anything else is refused. The 'version' output never carries the prefix.
    required: false
    default: ""
  mode:
    description: >-
      'tag' (default) derives the version and creates and pushes the tag. 'lookup' runs the same
      derivation, every refusal included, and reports the outputs without creating anything; it
      needs no write permission. Look up first to learn whether this tree is already released
      (released-as) before spending checks and a build, then tag at the end of the job.
    required: false
    default: "tag"
  expect-tag:
    description: >-
      The tag a lookup step in the same job reported (steps.<id>.outputs.tag). When set, the Action
      refuses to create any other tag, so a job that skipped its checks on the look-up's word never
      tags a different number. Empty (default) skips the comparison.
    required: false
    default: ""

outputs:
  is-env:
    description: '"true" if the branch is a deployable environment, else "false".'
    value: ${{ steps.resolve.outputs.is-env }}
  version:
    description: "The derived MM.P version (set only for an environment push)."
    value: ${{ steps.derive.outputs.version }}
  tag:
    description: "The derived <prefix>vMM.P<suffix> tag (set only for an environment push)."
    value: ${{ steps.derive.outputs.tag }}
  released-as:
    description: >-
      An existing tag that already carries this version's number on this exact tree (the first by
      name), when the number is reused from an earlier release; empty when the number is new, and
      always empty under version-strategy package-json. A promotion uses it to find the build its
      upstream environment made.
    value: ${{ steps.derive.outputs.released-as }}

runs:
  using: "composite"
  steps:
    # 1. resolve-env — the short-circuit. Always runs; sets is-env.
    #    Inputs reach the scripts through env: only. An expression written inside run: is pasted
    #    into the script text before bash parses it, so a branch named `x$(cmd)` would execute.
    - id: resolve
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        MANIFEST: ${{ inputs.manifest }}
      run: bash "$GITHUB_ACTION_PATH/scripts/resolve-env.sh" "$BRANCH"

    # 2. derive-version — only for an environment push. Sets version/tag/released-as; in tag mode
    #    it also creates and pushes the tag, in lookup mode it creates nothing.
    - id: derive
      if: steps.resolve.outputs.is-env == 'true'
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        MANIFEST: ${{ inputs.manifest }}
        PACKAGE_JSON: ${{ inputs.package-json }}
        MAJOR_MINOR: ${{ inputs.major-minor }}
        VERSION_STRATEGY: ${{ inputs.version-strategy }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        MODE: ${{ inputs.mode }}
        EXPECT_TAG: ${{ inputs.expect-tag }}
      run: bash "$GITHUB_ACTION_PATH/scripts/derive-version.sh" "$BRANCH"
