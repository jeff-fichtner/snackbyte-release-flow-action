name: test

# The Action's pull-request gate: the release-flow test suite and a real `uses: ./` run, as steps
# of one job (every job bills at least a minute; see "Keep the Actions bill down" in CONSUMING.md).
# Pushes to main run the suite again in release.yml, before the tag.
# A red suite blocks (Constitution V "fail loud"; base Principle VII "test MUST run successfully").
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true # a new push to the PR replaces the run in flight

jobs:
  validate:
    name: validate (merge gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags — the suite builds its own repos but this matches consumer guidance
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The bash acceptance suite: derivation matrix B1–B15 + extraction-delta P3–P5,
      # resolve-env P1–P2, one-row-edit proof, and the action.yml interface replay (I1–I2).
      - name: Run test:release
        run: npm run test:release

      # True end-to-end: invoke the REAL composite Action via `uses: ./` against a scratch
      # manifest and assert its outputs — proving the action.yml wiring works on a real runner (not
      # just the local interface replay). The token is read-only, so no tag reaches this repo;
      # asserts is-env for both an env and a non-env branch.
      - name: Write a scratch 2-env manifest
        run: |
          cat > /tmp/envs.json <<'JSON'
          { "environments": [
            { "name":"production","branch":"main","isPublicFace":true,"noindex":false,"tagSuffix":"" },
            { "name":"staging","branch":"dev","isPublicFace":false,"noindex":true,"tagSuffix":"-dev" }
          ] }
          JSON

      # A NON-environment branch: is-env must be false; no derivation, no tag.
      - id: nonenv
        uses: ./
        with:
          branch: feature-does-not-exist
          manifest: /tmp/envs.json
      - name: Assert non-env short-circuit
        run: |
          echo "is-env=${{ steps.nonenv.outputs.is-env }}"
          test "${{ steps.nonenv.outputs.is-env }}" = "false"
          test -z "${{ steps.nonenv.outputs.tag }}"

      # An environment branch: is-env must be true. (We do NOT push a tag here — this asserts the
      # resolve gate/output wiring on a real runner; tag creation is covered by the interface test.)
      - id: env
        uses: ./
        with:
          branch: main
          manifest: /tmp/envs.json
          major-minor: "9.9" # scratch line so any tag would be v9.9.* and not collide with real tags
        continue-on-error: true # the derive step may decline to push without write perms; is-env is the assertion
      - name: Assert env recognized
        run: |
          echo "is-env=${{ steps.env.outputs.is-env }}"
          test "${{ steps.env.outputs.is-env }}" = "true"

      # Build once (feature 006): a real look-up on a runner, with this job's read-only token. A
      # local, unpushed tag stands in for staging's release of this tree; the look-up for main must
      # report it as released-as and create nothing. Its own 8.8 line keeps it clear of the step above.
      - name: Stand in for a staging release of this tree
        run: git tag v8.8.4-dev
      - id: lookup
        uses: ./
        with:
          branch: main
          manifest: /tmp/envs.json
          major-minor: "8.8"
          mode: lookup
      - name: Assert the look-up reports the release and tags nothing
        env:
          VERSION: ${{ steps.lookup.outputs.version }}
          TAG: ${{ steps.lookup.outputs.tag }}
          RELEASED_AS: ${{ steps.lookup.outputs.released-as }}
        run: |
          echo "version=$VERSION tag=$TAG released-as=$RELEASED_AS"
          test "$VERSION" = "8.8.4"
          test "$TAG" = "v8.8.4"
          test "$RELEASED_AS" = "v8.8.4-dev"
          test "$(git tag -l 'v8.8.*')" = "v8.8.4-dev"
